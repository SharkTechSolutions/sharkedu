<div class="alert alert--ok" id="successAlert" role="status"></div>
<div class="alert alert--err" id="errorAlert" role="alert"></div>

<form id="enrollForm" novalidate>
  <div class="form-group">
    <label for="studentName">Name <span aria-hidden="true">*</span></label>
    <input type="text" id="studentName" name="student_name" autocomplete="name" required placeholder="Your full name" />
    <p class="form-error" id="nameError" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="studentEmail">Email <span aria-hidden="true">*</span></label>
    <input type="email" id="studentEmail" name="student_email" autocomplete="email" required placeholder="you@example.com" />
    <p class="form-error" id="emailError" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="studentPhone">Phone <span aria-hidden="true">*</span></label>
    <input type="tel" id="studentPhone" name="student_phone" autocomplete="tel" required placeholder="+91 98765 43210" />
    <p class="form-error" id="phoneError" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="studentNote">Note <span class="opt">(optional)</span></label>
    <textarea id="studentNote" name="student_note" placeholder="Questions or comments..."></textarea>
  </div>

  <button type="submit" class="btn-submit" id="submitBtn">Submit Enrollment</button>
</form>
